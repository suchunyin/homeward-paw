# Ruff 配置 - 宠物救助领养平台
# 文档: https://docs.astral.sh/ruff/settings/

target-version = "py312"
line-length = 110

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import 排序)
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501", # 行长度 (交给 formatter 处理)
]

[lint.isort]
# import 分组顺序: 标准库 → 第三方 → 本地模块(本项目的)
known-first-party = ["app"]

[format]
# 自动格式化相关
quote-style = "double"
indent-style = "space"
